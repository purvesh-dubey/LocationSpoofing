name: Distribute to Firebase

# Every push to main builds the debug APK and emails it to the "me" tester group in Firebase App Distribution.
# One-time setup (the three repository secrets below) is in docs/firebase-distribution.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# The job only needs to read the repo; Firebase is reached with the service-account secret, not the GitHub token.
permissions:
  contents: read

env:
  # Not a secret: the app id is public inside any APK that uses Firebase.
  # Firebase console > Project settings > Your apps > App ID.
  FIREBASE_APP_ID: "1:510465691428:android:1b1a2d2d3f7c41729c2db1"

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fail in seconds with a readable message instead of after a 5-minute build with a cryptic one.
      - name: Check repository secrets are set
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          for name in FIREBASE_SERVICE_ACCOUNT CI_KEYSTORE_BASE64 CI_KEYSTORE_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See docs/firebase-distribution.md."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Accepts the SDK licences so Gradle can download platform 36.1 and build-tools on the runner.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # The same key on every run, so a phone can update the app in place instead of "package conflicts".
      - name: Restore signing key
        env:
          CI_KEYSTORE_BASE64: ${{ secrets.CI_KEYSTORE_BASE64 }}
        run: echo "$CI_KEYSTORE_BASE64" | base64 -d > app/ci-debug.keystore

      # Same checks as local development: a push that breaks tests or lint is not sent to testers.
      - name: Build, test and lint
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.CI_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug -PciVersionCode=${{ github.run_number }}

      # Third-party action that receives the Firebase key, so it is pinned to an exact commit (v1.7.1).
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: me
          file: app/build/outputs/apk/debug/app-debug.apk
          # Quoted, and no "#" inside: in YAML a " #" starts a comment and silently cuts the expression short.
          releaseNotes: "${{ github.event.head_commit.message || format('Manual run {0}', github.run_number) }}"
